version: '3.8'

services:
  cropcopilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cropcopilot
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      # Persist SQLite database and ChromaDB vector store between container restarts
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
