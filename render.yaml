# ==============================================================================
# Render Blueprint Configuration (https://render.com)
# ==============================================================================
services:
  - type: web
    name: cropcopilot
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python data_ingestion.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NVIDIA_API_KEY
        sync: false
